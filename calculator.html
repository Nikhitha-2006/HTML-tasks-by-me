<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * * {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to right, #1e3c72, #2a5298);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.calculator {
  background: #ffffff;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
  width: 100%;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

#display {
  height: 60px;
  font-size: 1.8em;
  text-align: right;
  padding: 10px 15px;
  border: none;
  border-radius: 10px;
  background: #f0f4f8;
  color: #333;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

button {
  padding: 18px;
  font-size: 1.2em;
  border: none;
  border-radius: 10px;
  background: #e0e7ff;
  color: #1e3c72;
  cursor: pointer;
  transition: background 0.2s ease;
}

button:hover {
  background: #c7d2fe;
}

button:active {
  transform: scale(0.98);
}

/* Operator buttons: %, x, /, *, -, + */
button:nth-child(2),
button:nth-child(3),
button:nth-child(4),
button:nth-child(8),
button:nth-child(12),
button:nth-child(16) {
  background: #ff6b6b;
  color: #fff;
}

button:nth-child(2):hover,
button:nth-child(3):hover,
button:nth-child(4):hover,
button:nth-child(8):hover,
button:nth-child(12):hover,
button:nth-child(16):hover {
  background: #ff4f4f;
}

/* Equals button (=) */
button:nth-child(20) {
  background: #38b2ac;
  color: #fff;
}

button:nth-child(20):hover {
  background: #2c7a7b;
}

/* Clear button (C) */
button:nth-child(1) {
  background: #f6ad55;
  color: #fff;
  font-weight: bold;
}

button:nth-child(1):hover {
  background: #dd6b20;
}
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" disabled />
    <div class="buttons">
      <button>C</button><button>%</button><button>x</button><button>/</button>
      <button>7</button><button>8</button><button>9</button><button>*</button>
      <button>4</button><button>5</button><button>6</button><button>-</button>
      <button>1</button><button>2</button><button>3</button><button>+</button>
      <button>00</button><button>0</button><button>.</button><button>=</button>
      
    </div>
  </div>

  <script>
  const display = document.getElementById('display');
  const buttons = document.querySelectorAll('button');

  buttons.forEach(button => {
    button.addEventListener('click', () => {
      const value = button.textContent;

      if (value === 'C') {
        display.value = '';
      } else if (value === 'x') {
        display.value = display.value.slice(0, -1);
      } else if (value === '=') {
        try {
          display.value = eval(display.value);
        } catch {
          display.value = 'Error';
        }
      } else {
        display.value += value;
      }
    });
  });
</script>
</body>
</html>
