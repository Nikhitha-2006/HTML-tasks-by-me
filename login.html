<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<style>
    h1{
        background-color: rgb(158, 193, 193);
        text-align: center;
    }
    form{
        margin-left: 40%;
        align-content: center;
        border: 2px solid #000; 
        width: fit-content;     
        padding: 20px;       
    }
    label{
        display: block;
        margin-top: 10px;
        margin-bottom: 5px;
    }
</style>
<body>
    <h1>Login</h1>
    <form>
        <fieldset>
            <legend>login</legend>
        <label for="us">User Name:</label>
        <input type="text" name="us" id="us"><br>
        <label for="e">Email:</label>
        <input type="email" name="e" id="e"><br>
        <label for="us">Password:</label>
        <input type="password" name="pw" id="pw"><br>
        <input type="submit" value="submit">
        <input type="reset" value="reset">
        </fieldset>
    </form>
    
</body>
</html>
